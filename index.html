<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT Downloader - Mandiri & Tanpa Iklan</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
            width: 90%;
            max-width: 500px;
        }
        h1 { color: #ff0000; margin-bottom: 20px; font-size: 24px; }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #333;
            border-radius: 5px;
            background-color: #2a2a2a;
            color: #fff;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #ff0000;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover { background-color: #cc0000; }
        .status { margin-top: 15px; font-size: 14px; color: #ffc107; }
        .download-link {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 25px;
            background-color: #0087ff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .download-link:hover { background-color: #0069cc; }
    </style>
</head>
<body>

<div class="container">
    <h1>YouTube Downloader</h1>
    <p>Sistem Pengunduh Mandiri Bebas Iklan</p>
    <input type="text" id="videoUrl" placeholder="Tempel link YouTube (Format lengkap/pendek)...">
    <button onclick="prosesDownload()">Mulai Mengunduh</button>
    <div class="status" id="statusMessage"></div>
    <div id="downloadArea"></div>
</div>

<script>
async function prosesDownload() {
    const urlInput = document.getElementById('videoUrl').value.trim();
    const statusText = document.getElementById('statusMessage');
    const downloadArea = document.getElementById('downloadArea');
    
    if (!urlInput) {
        statusText.innerText = "Silakan masukkan URL YouTube terlebih dahulu!";
        return;
    }

    statusText.innerText = "Sedang memproses video di latar belakang cloud...";
    downloadArea.innerHTML = "";

    try {
        // Menggunakan API Serverless Publik untuk konversi video secara realtime
        const apiEndpoint = `https://allorigins.win{encodeURIComponent('https://cobalt.tools')}`;
        
        const response = await fetch('https://shifuserver.xyz', { 
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url: urlInput })
        });
        
        const data = await response.json();

        if (data && data.url) {
            statusText.style.color = "#00ff88";
            statusText.innerText = "Video Sukses Diproses!";
            // Memunculkan tombol download file MP4 milik Anda sendiri
            downloadArea.innerHTML = `<a href="${data.url}" target="_blank" class="download-link">Unduh File MP4 Sekarang</a>`;
        } else {
            // Jalur mesin cadangan otomatis jika API pertama sibuk
            ambilViaCadangan(urlInput);
        }
    } catch (error) {
        ambilViaCadangan(urlInput);
    }
}

async function ambilViaCadangan(url) {
    const statusText = document.getElementById('statusMessage');
    const downloadArea = document.getElementById('downloadArea');
    
    try {
        // Menembak API Serverless alternatif (Y2mate engine bypass)
        const res = await fetch(`https://vextr.xyz{encodeURIComponent(url)}`);
        const json = await res.json();
        
        if(json.download_url) {
            statusText.style.color = "#00ff88";
            statusText.innerText = "Video Sukses Diproses (Jalur Cadangan)!";
            downloadArea.innerHTML = `<a href="${json.download_url}" target="_blank" class="download-link">Unduh File MP4 Sekarang</a>`;
        } else {
            statusText.innerText = "Gagal memproses. Pastikan link YouTube Anda benar.";
        }
    } catch (e) {
        statusText.style.color = "#ff4444";
        statusText.innerText = "Koneksi cloud sibuk, silakan coba lagi beberapa saat.";
    }
}
</script>

</body>
</html>
